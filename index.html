<script>

function redo(){if(!R.length)return;msel=[];H.push(JSON.stringify(P));P=JSON.parse(R.pop());sel=null;chain=null;upd()}
const W2S=(x,y)=>[x*V.s+V.x,y*V.s+V.y],S2W=(x,y)=>[(x-V.x)/V.s,(y-V.y)/V.s];

addEventListener('resize',rs);
let angMode=90;
function snapPt(sx,sy,from){
 const[x,y]=S2W(sx,sy),tol=24/V.s;let bn=null,bd=tol;
 for(const n of P.nodes){const d=Math.hypot(n.x-x,n.y-y);if(d<bd){bd=d;bn=n}}
 if(!from){
  if(bn)return{x:bn.x,y:bn.y,node:bn};
  {let bw=null,bdw=tol;for(const w of P.walls){if(w.s)continue;const a=nd(w.a),b=nd(w.b),dx=b.x-a.x,dy=b.y-a.y,L2=dx*dx+dy*dy||1,t=((x-a.x)*dx+(y-a.y)*dy)/L2;if(t<=0||t>=1)continue;const qx=a.x+dx*t,qy=a.y+dy*t,d=Math.hypot(x-qx,y-qy);if(d<bdw){bdw=d;bw={x:Math.round(qx),y:Math.round(qy),wall:w}}}
   if(bw)return bw}
  let px=Math.round(x/10)*10,py=Math.round(y/10)*10,gx=null,gy=null;
  for(const n of P.nodes){if(Math.abs(n.x-x)<tol&&(!gx||Math.abs(n.x-x)<Math.abs(gx.x-x)))gx=n;if(Math.abs(n.y-y)<tol&&(!gy||Math.abs(n.y-y)<Math.abs(gy.y-y)))gy=n}
  if(gx)px=gx.x;if(gy)py=gy.y;
  return{x:px,y:py,gx,gy}}
 const dx=x-from.x,dy=y-from.y;let a=Math.atan2(dy,dx);
 if(angMode){const st=Math.PI/(angMode===90?2:4);a=Math.round(a/st)*st}
 else{const st=Math.PI/4,k=Math.round(a/st);if(Math.abs(a-k*st)<.07)a=k*st}
 const ux=Math.cos(a),uy=Math.sin(a);
   if(bn){const rx=bn.x-from.x,ry=bn.y-from.y;if(Math.abs(rx*uy-ry*ux)<tol*.7&&rx*ux+ry*uy>0)return{x:bn.x,y:bn.y,node:bn}}
 {const Lr=Math.max(0,dx*ux+dy*uy);let bw=null,bdw=tol;for(const w of P.walls){if(w.s||w.a===from.id||w.b===from.id)continue;const p=nd(w.a),q=nd(w.b),ex=q.x-p.x,ey=q.y-p.y,den=ux*ey-uy*ex;if(Math.abs(den)<1e-9)continue;const t=((p.x-from.x)*ey-(p.y-from.y)*ex)/den,sp=((p.x-from.x)*uy-(p.y-from.y)*ux)/den,Lw=Math.hypot(ex,ey);if(t<=0||sp<=0||sp>=1||Math.min(sp,1-sp)*Lw<tol*.4)continue;const d=Math.abs(t-Lr);if(d<bdw){bdw=d;bw={x:Math.round(from.x+ux*t),y:Math.round(from.y+uy*t),wall:w}}}
  if(bw)return bw}
 let L=Math.max(0,dx*ux+dy*uy),best=null,bl=tol;
 const ax=Math.abs(ux)>.999,ay=Math.abs(uy)>.999;
 if(ax||ay)for(const n of P.nodes){if(n.id===from.id)continue;const c=ax?(n.x-from.x)*ux:(n.y-from.y)*uy;if(c>0&&Math.abs(c-L)<bl){bl=Math.abs(c-L);best={L:c,g:n}}}
 if(!best)for(const w of P.walls){const p=nd(w.a),q=nd(w.b),c=Math.hypot(q.x-p.x,q.y-p.y);if(Math.abs(c-L)<tol*.6)best={L:c}}

function moveNodes(id,dx,dy,anchors){

  for(const w of P.walls){if(w.a!==c&&w.b!==c)continue;const m=w.a===c?w.b:w.a;if(fix.has(m))continue;
   const o=ori.get(w.id);if(!o)continue;const e=disp.get(m)||{dx:0,dy:0};let ch=false;

function deg(id){return P.walls.filter(w=>w.a===id||w.b===id).length}
function rooms(){
 const he=[],ou=new Map();P.nodes.forEach(n=>ou.set(n.id,[]));
 for(const w of P.walls){const a=nd(w.a),b=nd(w.b),h1={w,f:w.a,t:w.b,ang:Math.atan2(b.y-a.y,b.x-a.x)},h2={w,f:w.b,t:w.a,ang:Math.atan2(a.y-b.y,a.x-b.x)};h1.tw=h2;h2.tw=h1;he.push(h1,h2);ou.get(w.a).push(h1);ou.get(w.b).push(h2)}

 for(let i=0;i<he.length;i+=2){const h1=he[i],h2=he[i+1],w=h1.w,a=nd(w.a),b=nd(w.b),dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1,L=hf.get(h1),Rf=hf.get(h2),iL=L&&L.room,iR=Rf&&Rf.room;
